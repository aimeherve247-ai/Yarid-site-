<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>YARID | Produits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #020617; color: #f8fafc; -webkit-font-smoothing: antialiased; }
        .safe-top { padding-top: env(safe-area-inset-top, 0px); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes pulse-live { 0%,100% { box-shadow: 0 0 0 0 rgba(139,92,246,0.4); } 50% { box-shadow: 0 0 0 10px rgba(139,92,246,0); } }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .anim-fade-up { animation: fadeUp 0.6s ease-out forwards; opacity: 0; }
        .anim-d1 { animation-delay: 0.08s; }
        .anim-d2 { animation-delay: 0.16s; }
        .anim-d3 { animation-delay: 0.24s; }
        .anim-d4 { animation-delay: 0.32s; }
        .anim-d5 { animation-delay: 0.40s; }

        /* Product card premium */
        .product-card {
            background: linear-gradient(145deg, rgba(15,23,42,0.95), rgba(30,41,59,0.6));
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            border-color: rgba(139,92,246,0.25);
            transform: translateY(-6px);
            box-shadow: 0 24px 64px -20px rgba(139,92,246,0.15);
        }
        .product-card .card-image {
            position: relative; overflow: hidden;
        }
        .product-card .card-image img {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover .card-image img {
            transform: scale(1.08);
        }

        /* Badge */
        .badge-stock {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 10px; border-radius: 999px;
            font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
        }
        .badge-in { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); color: #34d399; }
        .badge-out { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #f87171; }

        /* Specs table */
        .specs-table { border-collapse: separate; border-spacing: 0; width: 100%; }
        .specs-table tr { border-bottom: 1px solid rgba(255,255,255,0.04); }
        .specs-table tr:last-child { border-bottom: none; }
        .specs-table td { padding: 10px 0; font-size: 0.8rem; }
        .specs-table td:first-child { color: #64748b; font-weight: 600; width: 40%; }
        .specs-table td:last-child { color: #f8fafc; font-weight: 700; }

        /* Buttons */
        .btn-whatsapp {
            background: linear-gradient(135deg, #25d366, #128c7e);
            border: none; border-radius: 16px; padding: 1rem 1.5rem;
            color: white; font-weight: 800; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.08em;
            cursor: pointer; transition: all 0.3s; width: 100%;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-whatsapp:hover { transform: translateY(-2px); box-shadow: 0 12px 40px -8px rgba(37,211,102,0.35); }
        .btn-whatsapp:active { transform: scale(0.97); }
        .btn-whatsapp:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-outline {
            background: transparent; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 1rem 1.5rem;
            color: #94a3b8; font-weight: 800; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.08em;
            cursor: pointer; transition: all 0.3s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-outline:hover { border-color: #8b5cf6; color: #a78bfa; background: rgba(139,92,246,0.05); }

        /* Discount badge */
        .discount-badge {
            position: absolute; top: 12px; left: 12px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white; padding: 4px 10px; border-radius: 10px;
            font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em;
            z-index: 5;
        }

        /* Product detail modal */
        .detail-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.88);
            backdrop-filter: blur(16px); z-index: 200;
            display: none; align-items: flex-end; justify-content: center;
            opacity: 0; transition: opacity 0.3s;
        }
        .detail-modal.active { display: flex; opacity: 1; }
        .detail-modal-content {
            background: linear-gradient(180deg, #0f172a, #020617);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 32px 32px 0 0;
            width: 100%; max-width: 640px; max-height: 92vh;
            overflow-y: auto; padding: 1.5rem;
            transform: translateY(100%); transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .detail-modal.active .detail-modal-content { transform: translateY(0); }

        /* Category hero */
        .category-hero {
            position: relative; border-radius: 24px; overflow: hidden;
            min-height: 160px; display: flex; align-items: flex-end;
            padding: 1.5rem;
        }
        .category-hero::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(2,6,23,0.95) 0%, rgba(2,6,23,0.4) 50%, rgba(2,6,23,0.1) 100%);
        }

        /* Scrollbar hide */
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Breadcrumb */
        .breadcrumb { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; }
        .breadcrumb a { color: #a78bfa; text-decoration: none; transition: color 0.2s; }
        .breadcrumb a:hover { color: #c4b5fd; }

        /* Floating cart button */
        .fab-cart {
            position: fixed; bottom: 24px; right: 24px; z-index: 90;
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 32px -8px rgba(139,92,246,0.4);
            transition: all 0.3s; animation: pulse-live 3s infinite;
        }
        .fab-cart:hover { transform: scale(1.08); }
        .fab-cart .cart-count {
            position: absolute; top: -4px; right: -4px;
            background: #ef4444; color: white;
            width: 22px; height: 22px; border-radius: 50%;
            font-size: 10px; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #020617;
        }
    </style>
</head>
<body class="safe-top safe-bottom">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-[#020617]/90 backdrop-blur-xl border-b border-white/[0.04]">
        <div class="flex items-center justify-between px-4 h-14 max-w-lg mx-auto">
            <button onclick="history.back()" class="flex items-center gap-2 text-slate-400 hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
                <span class="text-xs font-bold">Retour</span>
            </button>
            <div class="text-center">
                <h1 class="text-sm font-black italic uppercase tracking-tight" id="header-title">Produits</h1>
            </div>
            <div class="w-16"></div>
        </div>
    </header>

    <main class="max-w-lg mx-auto px-4 py-4">

        <!-- Breadcrumb -->
        <nav class="breadcrumb mb-4 anim-fade-up" id="breadcrumb">
            <a href="service-detail.html">Services</a>
            <span class="mx-2">/</span>
            <a href="service-detail.html" id="bc-cat">Categorie</a>
            <span class="mx-2">/</span>
            <span class="text-slate-400" id="bc-service">Service</span>
        </nav>

        <!-- Category Hero -->
        <div class="category-hero mb-6 anim-fade-up anim-d1" id="cat-hero">
            <div class="relative z-10">
                <span class="text-[10px] font-black uppercase tracking-[0.3em] mb-2 block" id="cat-soustitre" style="color: var(--cat-color, #8b5cf6)">Chargement...</span>
                <h2 class="text-2xl font-black italic uppercase text-white leading-tight" id="cat-titre">...</h2>
                <p class="text-xs text-slate-400 mt-1 leading-relaxed" id="cat-desc">...</p>
            </div>
        </div>

        <!-- Service info -->
        <div class="flex items-center justify-between mb-5 anim-fade-up anim-d2">
            <div>
                <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500" id="nb-produits">0 produits</span>
                <h3 class="text-lg font-black text-white mt-0.5" id="service-titre">...</h3>
            </div>
            <div class="text-right">
                <p class="text-xs text-slate-500">A partir de</p>
                <p class="text-lg font-black text-white" id="prix-base">0 FCFA</p>
            </div>
        </div>

        <!-- Produits grid -->
        <div id="produits-grid" class="space-y-5 pb-8">
            <div class="text-center py-12">
                <div class="w-8 h-8 border-2 border-violet-500/20 border-t-violet-500 rounded-full animate-spin mx-auto"></div>
                <p class="text-xs text-slate-500 mt-3 font-semibold">Chargement des produits...</p>
            </div>
        </div>

    </main>

    <!-- Detail Modal -->
    <div id="detail-modal" class="detail-modal" onclick="closeDetailModal(event)">
        <div class="detail-modal-content" onclick="event.stopPropagation()">
            <!-- Close -->
            <div class="flex justify-between items-start mb-4">
                <span class="badge-stock badge-in" id="modal-stock">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                    En stock
                </span>
                <button onclick="closeDetailModal()" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Image -->
            <div class="rounded-2xl overflow-hidden mb-5 bg-white/3" id="modal-img-container">
                <img id="modal-img" src="" alt="" class="w-full h-56 object-cover" style="display:none">
                <div id="modal-img-placeholder" class="h-56 flex items-center justify-center text-slate-600">
                    <svg class="w-12 h-12 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                </div>
            </div>

            <!-- Title & price -->
            <h2 class="text-xl font-black text-white mb-2" id="modal-nom">Produit</h2>
            <div class="flex items-baseline gap-3 mb-5">
                <span class="text-2xl font-black text-violet-400" id="modal-prix">0 FCFA</span>
                <span class="text-sm text-slate-500 line-through" id="modal-old-prix" style="display:none"></span>
            </div>

            <!-- Caracteristiques -->
            <p class="text-[10px] font-bold uppercase tracking-[0.3em] text-slate-500 mb-3">Caracteristiques</p>
            <div class="bg-white/[0.02] rounded-2xl p-4 mb-6 border border-white/[0.04]">
                <table class="specs-table" id="modal-specs">
                    <!-- Rempli par JS -->
                </table>
            </div>

            <!-- Actions -->
            <div class="space-y-3">
                <button onclick="commanderProduit()" class="btn-whatsapp" id="modal-btn-commander">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.067 2.877 1.215 3.076.149.198 2.095 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                    Commander sur WhatsApp
                </button>
                <button onclick="closeDetailModal()" class="btn-outline">Continuer les achats</button>
            </div>
        </div>
    </div>

    <script>
    // ==========================================
    // PAGE PRODUITS DYNAMIQUE
    // ==========================================

    let currentCategory = null;
    let currentService = null;
    let currentProduct = null;
    const schemaUrl = 'services-schema.json';

    // Charger depuis l'URL
    async function init() {
        const params = new URLSearchParams(window.location.search);
        const catId = params.get('cat');
        const svcId = params.get('service');

        if (!catId || !svcId) {
            document.getElementById('produits-grid').innerHTML =
                '<p class="text-center text-slate-500 text-sm py-12">Parametres manquants. <a href="service-detail.html" class="text-violet-400 underline">Retour aux services</a></p>';
            return;
        }

        try {
            const res = await fetch(schemaUrl + '?v=' + Date.now());
            const schema = await res.json();

            const cat = schema.categories.find(c => c.id === catId);
            const svc = cat ? cat.services.find(s => s.id === svcId || s.slug === svcId) : null;

            if (!cat || !svc) {
                document.getElementById('produits-grid').innerHTML =
                    '<p class="text-center text-slate-500 text-sm py-12">Service non trouve.</p>';
                return;
            }

            currentCategory = cat;
            currentService = svc;

            renderPage(cat, svc);
        } catch (e) {
            console.error(e);
            document.getElementById('produits-grid').innerHTML =
                '<p class="text-center text-slate-500 text-sm py-12">Erreur de chargement.</p>';
        }
    }

    function renderPage(cat, svc) {
        // Header
        document.getElementById('header-title').textContent = svc.titre;

        // Breadcrumb
        document.getElementById('bc-cat').textContent = cat.titre;
        document.getElementById('bc-service').textContent = svc.titre;

        // Category hero
        const hero = document.getElementById('cat-hero');
        hero.style.backgroundImage = `url(${cat.image_hero})`;
        hero.style.backgroundSize = 'cover';
        hero.style.backgroundPosition = 'center';
        document.documentElement.style.setProperty('--cat-color', cat.couleur);
        document.getElementById('cat-soustitre').textContent = cat.sous_titre;
        document.getElementById('cat-soustitre').style.color = cat.couleur;
        document.getElementById('cat-titre').textContent = cat.titre;
        document.getElementById('cat-desc').textContent = cat.description;

        // Service info
        const produits = svc.produits || [];
        document.getElementById('nb-produits').textContent = produits.length + ' produit' + (produits.length > 1 ? 's' : '');
        document.getElementById('service-titre').textContent = svc.titre;
        document.getElementById('prix-base').textContent = svc.prix_base.toLocaleString() + ' FCFA';

        // Produits
        renderProduits(produits, svc.prix_base);
    }

    function renderProduits(produits, prixBase) {
        const container = document.getElementById('produits-grid');

        if (!produits || produits.length === 0) {
            container.innerHTML = `
                <div class="text-center py-12 anim-fade-up">
                    <svg class="w-12 h-12 mx-auto mb-3 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                    <p class="text-sm text-slate-500 font-semibold">Aucun produit pour ce service</p>
                    <button onclick="openServiceFormDirect()" class="mt-4 btn-outline text-xs py-3 px-6 inline-flex">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        Faire une demande personnalisee
                    </button>
                </div>`;
            return;
        }

        container.innerHTML = produits.map((p, i) => {
            const hasDiscount = p.ancien_prix && p.ancien_prix > p.prix;
            const discountPct = hasDiscount ? Math.round((1 - p.prix / p.ancien_prix) * 100) : 0;
            const specsKeys = Object.keys(p.caracteristiques || {});
            const specsPreview = specsKeys.slice(0, 3).map(k => `<span class="text-[10px] text-slate-500 bg-white/[0.04] px-2 py-1 rounded-md">${k}</span>`).join('');

            return `
                <div class="product-card anim-fade-up anim-d${Math.min(i + 1, 5)}">
                    <div class="card-image">
                        ${hasDiscount ? `<span class="discount-badge">-${discountPct}%</span>` : ''}
                        <span class="badge-stock ${p.en_stock ? 'badge-in' : 'badge-out'}" style="position:absolute;top:12px;right:12px;z-index:5">
                            ${p.en_stock
                                ? '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg> En stock'
                                : '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg> Rupture'
                            }
                        </span>
                        <img src="${p.image || ''}" alt="${p.nom}" class="w-full h-48 object-cover" loading="lazy"
                             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                        <div class="h-48 items-center justify-center text-slate-700 bg-white/[0.02]" style="display:none">
                            <svg class="w-12 h-12 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        </div>
                    </div>
                    <div class="p-5">
                        <div class="flex items-start justify-between mb-2">
                            <h4 class="font-bold text-sm text-white leading-snug flex-1 pr-3">${p.nom}</h4>
                            <div class="text-right flex-shrink-0">
                                <p class="text-base font-black text-white">${p.prix.toLocaleString()} <span class="text-[9px] font-bold text-slate-500">FCFA</span></p>
                                ${hasDiscount ? `<p class="text-[10px] text-slate-500 line-through">${p.ancien_prix.toLocaleString()} FCFA</p>` : ''}
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-1.5 mb-4">${specsPreview}</div>

                        <div class="flex gap-2">
                            <button onclick="openDetailModal('${p.id}')" class="btn-outline text-[10px] py-3 px-4 flex-shrink-0">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                Details
                            </button>
                            <button onclick="commanderDirect('${p.id}')" class="btn-whatsapp text-[10px] py-3 flex-1" ${!p.en_stock ? 'disabled' : ''}>
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.067 2.877 1.215 3.076.149.198 2.095 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                                ${p.en_stock ? 'Commander' : 'Indisponible'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ==========================================
    // DETAIL MODAL
    // ==========================================

    function openDetailModal(productId) {
        const produit = (currentService.produits || []).find(p => p.id === productId);
        if (!produit) return;
        currentProduct = produit;

        // Image
        const img = document.getElementById('modal-img');
        const placeholder = document.getElementById('modal-img-placeholder');
        if (produit.image) {
            img.src = produit.image;
            img.alt = produit.nom;
            img.style.display = 'block';
            placeholder.style.display = 'none';
            img.onerror = function() {
                img.style.display = 'none';
                placeholder.style.display = 'flex';
            };
        } else {
            img.style.display = 'none';
            placeholder.style.display = 'flex';
        }

        // Stock
        const stockEl = document.getElementById('modal-stock');
        stockEl.className = 'badge-stock ' + (produit.en_stock ? 'badge-in' : 'badge-out');
        stockEl.innerHTML = produit.en_stock
            ? '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg> En stock'
            : '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg> Rupture de stock';

        // Nom & prix
        document.getElementById('modal-nom').textContent = produit.nom;
        document.getElementById('modal-prix').textContent = produit.prix.toLocaleString() + ' FCFA';
        const oldPrix = document.getElementById('modal-old-prix');
        if (produit.ancien_prix && produit.ancien_prix > produit.prix) {
            oldPrix.textContent = produit.ancien_prix.toLocaleString() + ' FCFA';
            oldPrix.style.display = 'inline';
        } else {
            oldPrix.style.display = 'none';
        }

        // Specs
        const specsTable = document.getElementById('modal-specs');
        specsTable.innerHTML = Object.entries(produit.caracteristiques || {})
            .map(([key, val]) => `<tr><td>${key}</td><td>${val}</td></tr>`)
            .join('');

        // Bouton
        const btn = document.getElementById('modal-btn-commander');
        btn.disabled = !produit.en_stock;
        btn.innerHTML = produit.en_stock
            ? '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.067 2.877 1.215 3.076.149.198 2.095 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> Commander sur WhatsApp'
            : 'Produit indisponible';

        // Open
        document.getElementById('detail-modal').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeDetailModal(event) {
        if (!event || event.target === document.getElementById('detail-modal')) {
            document.getElementById('detail-modal').classList.remove('active');
            document.body.style.overflow = '';
        }
    }

    // ==========================================
    // COMMANDE WHATSAPP
    // ==========================================

    function commanderDirect(productId) {
        const produit = (currentService.produits || []).find(p => p.id === productId);
        if (!produit || !produit.en_stock) return;
        sendWhatsAppOrder(produit);
    }

    function commanderProduit() {
        if (!currentProduct || !currentProduct.en_stock) return;
        sendWhatsAppOrder(currentProduct);
        closeDetailModal();
    }

    function sendWhatsAppOrder(produit) {
        const specs = Object.entries(produit.caracteristiques || {})
            .map(([k, v]) => `-${k}: ${v}`).join('\n');

        const msg = `*COMMANDE YARID - ${produit.nom}*\n\n` +
            `*Reference:* ${produit.id}\n` +
            `*Prix:* ${produit.prix.toLocaleString()} FCFA\n` +
            (produit.ancien_prix ? `*Promo:* -${Math.round((1 - produit.prix / produit.ancien_prix) * 100)}%\n` : '') +
            `\n*Caracteristiques:*\n${specs}\n\n` +
            `*Categorie:* ${currentCategory.titre} > ${currentService.titre}\n\n` +
            `Bonjour YARID, je souhaite commander ce produit. Merci de confirmer la disponibilite et les frais de livraison.`;

        const encodedMsg = encodeURIComponent(msg);
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const url = isMobile
            ? 'whatsapp://send?phone=237655959284&text=' + encodedMsg
            : 'https://api.whatsapp.com/send?phone=237655959284&text=' + encodedMsg;

        // Creer un lien et cliquer
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function openServiceFormDirect() {
        // Redirige vers le formulaire de demande generique
        window.location.href = 'service-detail.html?service=' + currentService.id;
    }

    // Init
    document.addEventListener('DOMContentLoaded', init);
    </script>
