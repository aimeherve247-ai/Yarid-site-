<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Categories | YARID</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="cart-global.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
        
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        body { 
            background: #f8fafc; 
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }
        
        .category-card {
            background: white;
            border-radius: 24px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }
        
        .category-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border-color: #0ea5e9;
        }
        
        .category-image-container {
            width: 56px;
            height: 56px;
            border-radius: 1rem;
            overflow: hidden;
            background: #f1f5f9;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e2e8f0;
            padding-bottom: var(--safe-bottom);
            z-index: 100;
        }
        
        .nav-item.active { color: #0ea5e9; }

        /* ===== CART DRAWER STYLES ===== */
        .cart-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1050;
            display: none; backdrop-filter: blur(4px);
        }
        .cart-overlay.active { display: block; }
        .cart-drawer {
            position: fixed; right: 0; top: 0; height: 100%; width: 100%; max-width: 420px;
            background: white; z-index: 1100;
            transform: translateX(100%); transition: transform 0.3s ease;
            box-shadow: -10px 0 40px rgba(0,0,0,0.1);
        }
        .cart-drawer.open { transform: translateX(0); }
    </style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YARID">

<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon_32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon_16.png">
<link rel="apple-touch-icon" href="/icons/ios.png">

<meta property="og:type" content="website">
<meta property="og:title" content="YARID - Boutique Premium">
<meta property="og:description" content="Votre destination exclusive pour des produits d'exception au Cameroun.">

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker enregistre !'))
        .catch(err => console.log('Erreur SW:', err));
    });
  }
</script>

</head>
<body class="antialiased text-slate-900 pb-20">

    <header class="fixed top-0 left-0 right-0 bg-white/95 backdrop-blur-md z-50 border-b border-slate-100">
        <div class="flex items-center justify-between px-4 h-14">
            <button onclick="history.back()" class="p-2 -ml-2 rounded-full hover:bg-slate-100 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>
            <h1 class="text-lg font-black italic uppercase">Categories</h1>
            <button onclick="toggleCart()" class="relative p-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-black rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
            </button>
        </div>
    </header>

    <main class="pt-14">
        
        <section class="px-4 py-4">
            <div class="relative">
                <svg class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input type="text" 
                       id="category-search" 
                       placeholder="Rechercher une categorie..." 
                       class="w-full pl-12 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm outline-none focus:border-sky-500 transition"
                       oninput="filterCategories(this.value)">
            </div>
        </section>

        <section class="px-4 pb-6">
            <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4">Toutes les categories</h2>
            
            <div class="grid grid-cols-3 gap-3" id="categories-grid">
                <div class="col-span-3 py-10 text-center text-slate-400 text-xs animate-pulse">Chargement de l'inventaire...</div>
            </div>
        </section>

        <section class="px-4 pb-6">
            <h2 class="text-[10px] font-black uppercase tracking-widest text-sky-500 mb-4">Selection Populaire</h2>
            <div class="space-y-3" id="popular-categories">
                </div>
        </section>

    </main>

    <nav class="bottom-nav">
        <div class="flex justify-around items-center h-16">
            <a href="index.html" class="nav-item flex flex-col items-center gap-1 p-2 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4m-4 0h4"/></svg>
                <span class="text-[9px] font-bold">Accueil</span>
            </a>
            <a href="categories.html" class="nav-item active flex flex-col items-center gap-1 p-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                <span class="text-[9px] font-bold">Categories</span>
            </a>
            <button onclick="toggleCart()" class="nav-item flex flex-col items-center gap-1 p-2 text-slate-400 relative">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                <span class="text-[9px] font-bold">Panier</span>
                <span id="nav-cart-count" class="absolute top-0 right-0 bg-red-500 text-white text-[7px] font-black rounded-full w-3.5 h-3.5 flex items-center justify-center hidden">0</span>
            </button>
            <button onclick="window.location.href='index.html#account'" class="nav-item flex flex-col items-center gap-1 p-2 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span class="text-[9px] font-bold">Compte</span>
            </button>
        </div>
    </nav>

    <!-- ===== CART DRAWER (hidden by default) ===== -->
    <div id="cart-overlay" class="cart-overlay" onclick="toggleCart()"></div>
    <div id="cart-drawer" class="cart-drawer">
        <div class="flex flex-col h-full">
            <div class="flex items-center justify-between p-4 border-b border-slate-100">
                <h2 class="text-lg font-black italic uppercase">Mon Panier</h2>
                <button onclick="toggleCart()" class="p-2 hover:bg-slate-100 rounded-full transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-4" id="cart-drawer-items">
                <p class="text-center text-slate-400 py-8 text-sm">Votre panier est vide</p>
            </div>
            <div class="p-4 border-t border-slate-100 space-y-3 bg-slate-50/50">
                <div class="flex justify-between text-sm"><span class="text-slate-500 font-medium">Sous-total</span><span class="font-bold" id="cart-subtotal">0 FCFA</span></div>
                <div class="flex justify-between text-lg font-black border-t border-slate-200 pt-2"><span>Total</span><span class="text-sky-600" id="cart-total-drawer">0 FCFA</span></div>
                <button onclick="orderCartViaWhatsApp()" class="w-full py-4 rounded-2xl text-white font-black text-xs uppercase tracking-widest flex items-center justify-center gap-2 transition hover:opacity-90" style="background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); box-shadow: 0 4px 15px rgba(37,211,102,0.3);">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                    Commander via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://whcpugnkldbmuqzgqxbe.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_LbTOPS3OgBPIJHJGEFKg9Q_djLjGvdk'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener('DOMContentLoaded', fetchCategoriesFromDB);

        async function fetchCategoriesFromDB() {
            const { data: produits, error } = await _supabase
                .from('PRODUITS')
                .select('categorie, image_url')
                .order('id', { ascending: false });

            if (error) {
                console.error("Erreur Supabase:", error);
                return;
            }

            const categoryData = {};
            produits.forEach(p => {
                if (!categoryData[p.categorie]) {
                    categoryData[p.categorie] = {
                        name: p.categorie,
                        image: p.image_url,
                        count: 0
                    };
                }
                categoryData[p.categorie].count++;
            });

            const uniqueList = Object.values(categoryData);
            renderGrid(uniqueList);
            renderPopular(uniqueList.slice(0, 4));
        }

        function renderGrid(list) {
            const grid = document.getElementById('categories-grid');
            grid.innerHTML = list.map(cat => `
                <div class="category-card" onclick="goToCategory('${cat.name}')">
                    <div class="category-image-container">
                        <img src="${cat.image}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                    <span class="text-[10px] font-black uppercase text-slate-700 text-center leading-tight">${cat.name}</span>
                    <span class="text-[8px] font-bold text-slate-400">${cat.count} Articles</span>
                </div>
            `).join('');
        }

        function renderPopular(list) {
            const container = document.getElementById('popular-categories');
            container.innerHTML = list.map(cat => `
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-100 cursor-pointer" onclick="goToCategory('${cat.name}')">
                    <div class="flex items-center gap-4 p-3">
                        <img src="${cat.image}" class="w-20 h-20 object-cover rounded-xl shadow-inner">
                        <div class="flex-1">
                            <h3 class="font-black text-xs uppercase text-slate-900">${cat.name}</h3>
                            <p class="text-[10px] text-slate-400 mt-0.5 italic">Qualite premium YARID</p>
                            <div class="flex items-center gap-1 mt-2 text-sky-500">
                                <span class="text-[9px] font-black uppercase">Explorer</span>
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function goToCategory(name) {
            window.location.href = 'category-view.html?cat=' + encodeURIComponent(name);
        }

        function filterCategories(query) {
            const cards = document.querySelectorAll('.category-card');
            cards.forEach(card => {
                const name = card.querySelector('span').innerText.toLowerCase();
                card.style.display = name.includes(query.toLowerCase()) ? 'flex' : 'none';
            });
        }

        // ===== PANIER INTEGRATION =====
        function orderCartViaWhatsApp() {
            var items = getCartItems();
            if (items.length === 0) { alert('Panier vide'); return; }
            var total = items.reduce(function(s, i) { return s + i.price * i.quantity; }, 0);
            var msg = 'Bonjour YARID ! Je souhaite commander :\n\n';
            items.forEach(function(item) { msg += '\u2022 ' + item.name + ' x' + item.quantity + ' = ' + (item.price * item.quantity).toLocaleString() + ' FCFA\n'; });
            msg += '\n*Total: ' + total.toLocaleString() + ' FCFA*';
            window.open('https://wa.me/237655959284?text=' + encodeURIComponent(msg), '_blank');
        }

        function updateCartCount() {
            try {
                var items = getCartItems();
                var count = items.reduce(function(s, i) { return s + i.quantity; }, 0);
                var badges = [document.getElementById('cart-count'), document.getElementById('nav-cart-count')];
                badges.forEach(function(badge) {
                    if (!badge) return;
                    if (count > 0) { badge.textContent = count; badge.classList.remove('hidden'); }
                    else badge.classList.add('hidden');
                });
            } catch(e) {}
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateCartCount();
            window.addEventListener('cartUpdated', updateCartCount);
        });
    </script>
</body>
</html>
