<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YARID | Hors Connexion</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        body {
            background: #0f172a;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(14, 165, 233, 0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        /* WiFi icon animation */
        .wifi-icon {
            position: relative;
            width: 120px;
            height: 120px;
        }
        .wifi-arc {
            position: absolute;
            border: 4px solid #334155;
            border-radius: 50%;
            border-bottom-color: transparent;
            border-left-color: transparent;
            transform: rotate(-45deg);
            animation: wifiPulse 2s ease-in-out infinite;
        }
        .wifi-arc:nth-child(1) { width: 120px; height: 120px; top: 0; left: 0; animation-delay: 0s; }
        .wifi-arc:nth-child(2) { width: 80px; height: 80px; top: 20px; left: 20px; animation-delay: 0.2s; }
        .wifi-arc:nth-child(3) { width: 40px; height: 40px; top: 40px; left: 40px; animation-delay: 0.4s; }
        .wifi-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #334155;
            border-radius: 50%;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            animation: wifiPulse 2s ease-in-out infinite 0.6s;
        }
        .wifi-slash {
            position: absolute;
            width: 4px;
            height: 70px;
            background: #ef4444;
            border-radius: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            animation: slashBlink 2s ease-in-out infinite;
        }
        @keyframes wifiPulse {
            0%, 100% { border-color: #334155; border-bottom-color: transparent; border-left-color: transparent; }
            50% { border-color: #0ea5e9; border-bottom-color: transparent; border-left-color: transparent; }
        }
        @keyframes slashBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .wifi-dot { animation-name: dotPulse; }
        @keyframes dotPulse {
            0%, 100% { background: #334155; }
            50% { background: #0ea5e9; }
        }

        /* Content */
        .content { position: relative; z-index: 1; text-align: center; padding: 2rem; }
        .btn-retry {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
            transition: all 0.3s ease;
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(14, 165, 233, 0.5);
        }
        .btn-retry:active { transform: scale(0.97); }
        .btn-home {
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.3s ease;
        }
        .btn-home:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.3);
        }

        /* Cached products section */
        .cached-section {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .cached-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .cached-item:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Spin animation for retry */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinning { animation: spin 0.8s linear infinite; }
    </style>
</head>
<body>
    <!-- Animated particles -->
    <div class="particles" id="particles"></div>

    <div class="content w-full max-w-md">
        <!-- Animated WiFi icon -->
        <div class="flex justify-center mb-8">
            <div class="wifi-icon">
                <div class="wifi-arc"></div>
                <div class="wifi-arc"></div>
                <div class="wifi-arc"></div>
                <div class="wifi-dot"></div>
                <div class="wifi-slash"></div>
            </div>
        </div>

        <!-- Brand -->
        <h1 class="text-white text-3xl font-black italic tracking-tighter uppercase mb-2">
            YARID<span class="text-sky-500">.</span>
        </h1>

        <!-- Title & Message -->
        <h2 class="text-white text-xl font-bold mb-3">Vous etes hors connexion</h2>
        <p class="text-slate-400 text-sm leading-relaxed mb-2 max-w-xs mx-auto">
            Pas de panique ! Vous pouvez toujours consulter les articles mis en cache ci-dessous.
        </p>
        <p class="text-slate-500 text-xs mb-8">
            Vos actions seront synchronisees des que la connexion sera retablie.
        </p>

        <!-- Cached products -->
        <div id="cached-products" class="cached-section p-4 mb-8 hidden">
            <div class="flex items-center gap-2 mb-3">
                <svg class="w-4 h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>
                </svg>
                <span class="text-white text-xs font-bold uppercase tracking-wider">Articles en cache</span>
                <span id="cached-count" class="text-sky-500 text-xs font-bold">0</span>
            </div>
            <div id="cached-list" class="space-y-2 max-h-40 overflow-y-auto scrollbar-hide"></div>
        </div>

        <!-- Action buttons -->
        <div class="flex flex-col gap-3">
            <button onclick="retryConnection()" id="btn-retry" class="btn-retry text-white py-4 rounded-2xl font-bold uppercase tracking-widest text-sm flex items-center justify-center gap-2">
                <svg id="retry-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                <span id="retry-text">Reessayer</span>
            </button>
            <a href="index.html" class="btn-home text-slate-300 py-4 rounded-2xl font-bold uppercase tracking-widest text-sm flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4m-4 0h4"/>
                </svg>
                Retour a l'accueil
            </a>
        </div>

        <!-- Connection status -->
        <div id="status-indicator" class="mt-6 flex items-center justify-center gap-2">
            <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
            <span class="text-slate-500 text-xs">Connexion perdue</span>
        </div>
    </div>

    <script>
        // Generate floating particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (8 + Math.random() * 12) + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            p.style.width = (2 + Math.random() * 3) + 'px';
            p.style.height = p.style.width;
            particlesContainer.appendChild(p);
        }

        // Load cached products from localStorage
        function loadCachedProducts() {
            try {
                const cart = JSON.parse(localStorage.getItem('yarid_cart')) || [];
                const recent = JSON.parse(localStorage.getItem('yarid_recent_products')) || [];
                const all = [...cart, ...recent].filter((v, i, a) => a.findIndex(t => t.id === v.id) === i);

                if (all.length > 0) {
                    document.getElementById('cached-products').classList.remove('hidden');
                    document.getElementById('cached-count').textContent = all.length;
                    document.getElementById('cached-list').innerHTML = all.slice(0, 5).map(item => `
                        <div class="cached-item flex items-center gap-3 p-2">
                            <img src="${item.image || item.image_url || 'https://via.placeholder.com/40'}"
                                 class="w-10 h-10 rounded-lg object-cover"
                                 onerror="this.style.display='none'">
                            <div class="flex-1 min-w-0 text-left">
                                <p class="text-white text-xs font-semibold truncate">${item.name || 'Produit'}</p>
                                <p class="text-slate-400 text-[10px]">${Number(item.price || 0).toLocaleString()} FCFA</p>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (e) { console.error('Erreur chargement cache:', e); }
        }

        // Retry connection
        function retryConnection() {
            const icon = document.getElementById('retry-icon');
            const text = document.getElementById('retry-text');
            icon.classList.add('spinning');
            text.textContent = 'Tentative...';

            fetch('https://www.google.com/favicon.ico', { mode: 'no-cors', cache: 'no-store' })
                .then(() => {
                    text.textContent = 'Connecte !';
                    icon.classList.remove('spinning');
                    setTimeout(() => window.location.reload(), 600);
                })
                .catch(() => {
                    text.textContent = 'Reessayer';
                    icon.classList.remove('spinning');
                    // Update status
                    const status = document.getElementById('status-indicator');
                    status.innerHTML = '<div class="w-2 h-2 rounded-full bg-red-500"></div><span class="text-red-400 text-xs">Toujours hors ligne</span>';
                    setTimeout(() => {
                        status.innerHTML = '<div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div><span class="text-slate-500 text-xs">Connexion perdue</span>';
                    }, 2000);
                });
        }

        // Listen for reconnection
        window.addEventListener('online', () => {
            document.getElementById('status-indicator').innerHTML =
                '<div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div><span class="text-emerald-400 text-xs">Connexion retablie !</span>';
            setTimeout(() => window.location.reload(), 1000);
        });

        // Init
        loadCachedProducts();
    </script>
</body>
</html>
