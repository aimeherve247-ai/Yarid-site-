                    <p>Chez YARID, nous sommes témoins de cette transformation chaque jour. Nos clients ne veulent plus juste "un t-shirt". Ils veulent une pièce qui raconte une histoire, qui les distingue, qui reflète qui ils sont.</p>

    function renderArticle() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const article = ARTICLES[id];
        const container = document.getElementById('article-container');

        if (!article) {
            container.innerHTML = `
                <div class="px-5 py-20 text-center">
                    <p style="font-size:48px;margin-bottom:16px;">📝</p>
                    <h1 class="font-display text-xl font-bold mb-2" style="color:var(--y-navy);">Article introuvable</h1>
                    <p style="font-size:13px;color:var(--y-gray-500);margin-bottom:24px;">Cet article n'existe pas ou a été déplacé.</p>
                    <a href="journal.html" style="display:inline-block;padding:12px 32px;background:var(--y-navy);color:white;border-radius:999px;font-size:12px;font-weight:700;text-decoration:none;">Retour au Journal</a>
                </div>
            `;
            document.title = 'Article introuvable | YARID';
            return;
        }

        document.title = article.title + ' | YARID Journal';
        container.innerHTML = '<div class="fade-in">' + article.content + '</div>';
    }

    function shareArticle() {
        if (navigator.share) {
            navigator.share({ title: document.title, url: window.location.href });
        } else {
            const url = window.location.href;
            const text = encodeURIComponent(document.title + ' — Lu sur Le Journal YARID');
            window.open('https://wa.me/?text=' + text + '%0A%0A' + encodeURIComponent(url), '_blank');
        }
    }

    renderArticle();
