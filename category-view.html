<!DOCTYPE html>

<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f8fafc; overscroll-behavior-y: none; }

        /* Product Cards v2 - same as index.html */
        .product-card-animated {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            transform-style: preserve-3d;
        }
        .product-card-animated:hover {
            transform: translateY(-12px) rotateX(4deg) rotateY(-2deg) scale(1.03);
            box-shadow: 0 30px 60px rgba(14, 165, 233, 0.18), 0 15px 30px rgba(0,0,0,0.12);
        }
        .product-image-container {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .product-card-animated:hover .product-image-container img {
            transform: scale(1.12);
        }
        .product-info-v2 {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .product-cat-v2 {
            font-size: 9px;
            font-weight: 800;
            color: #0ea5e9;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .product-title-v2 {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.35;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin: 0;
        }
        .product-price-row-v2 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.15rem;
        }
        .product-price-v2 {
            font-size: 14px;
            font-weight: 900;
            color: #0f172a;
        }
        .product-old-price {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            text-decoration: line-through;
        }
        .product-arrow-hint {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid #f1f5f9;
            font-size: 10px;
            font-weight: 600;
            color: #94a3b8;
            transition: color 0.25s ease;
        }
        .product-card-animated:hover .product-arrow-hint {
            color: #0ea5e9;
        }
        .product-arrow-hint svg {
            transition: transform 0.25s ease;
        }
        .product-card-animated:hover .product-arrow-hint svg {
            transform: translateX(3px);
        }
        .star-shimmer { position: relative; overflow: hidden; }
        .star-shimmer::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(250, 204, 21, 0.06) 50%, transparent 70%);
            animation: starShimmer 4s ease-in-out infinite;
            pointer-events: none; z-index: 1;
        }
        @keyframes starShimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        /* Bottom Nav */
        .mobile-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(226,232,240,0.5);
            box-shadow: 0 -4px 30px rgba(0,0,0,0.04);
            padding-bottom: env(safe-area-inset-bottom, 8px);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 12px; border-radius: 12px; transition: all 0.2s; color: #94a3b8; cursor: pointer; }
        .nav-item.active { color: #0f172a; background: rgba(15,23,42,0.05); }
        .nav-item:hover { color: #0f172a; }
        .nav-item svg { width: 20px; height: 20px; }

        /* WhatsApp Float */
        .wa-float-v2 {
            position: fixed;
            bottom: 100px;
            right: 20px;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
            border-radius: 50%;
            text-decoration: none;
            box-shadow: 0 6px 30px rgba(37, 211, 102, 0.45), 0 2px 10px rgba(0,0,0,0.12);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: waFloatPulse 3s ease-in-out infinite;
        }
        .wa-float-v2:hover { transform: translateY(-4px) scale(1.1); box-shadow: 0 12px 40px rgba(37, 211, 102, 0.55); }
        .wa-float-v2:active { transform: scale(0.95); }
        .wa-float-v2 svg { width: 28px; height: 28px; }
        @keyframes waFloatPulse {
            0%, 100% { box-shadow: 0 6px 30px rgba(37, 211, 102, 0.45), 0 2px 10px rgba(0,0,0,0.12); }
            50% { box-shadow: 0 10px 40px rgba(37, 211, 102, 0.6), 0 4px 15px rgba(0,0,0,0.15); }
        }

        /* Loading */
        .skeleton { background: #f1f5f9; animation: skeletonPulse 1.5s ease-in-out infinite; border-radius: 16px; }
        @keyframes skeletonPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="antialiased text-slate-900 pb-20">

        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>

    <!-- Bottom Nav -->
    <nav class="mobile-bottom-nav" style="padding-bottom: env(safe-area-inset-bottom, 8px);">
        <div class="flex items-center justify-around h-16 max-w-lg mx-auto">
            <a href="index.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0v-4m0 4h4"/></svg><span class="text-[9px] font-semibold">Accueil</span></a>

    <script>
    const SUPABASE_URL = 'https://whcpugnkldbmuqzgqxbe.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LbTOPS3OgBPIJHJGEFKg9Q_djLjGvdk';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var params = new URLSearchParams(window.location.search);
    var catFilter = params.get('cat') || '';
    var catName = params.get('name') || catFilter;

    document.getElementById('cat-title').textContent = catName.charAt(0).toUpperCase() + catName.slice(1);
    document.getElementById('cat-name').textContent = catName.charAt(0).toUpperCase() + catName.slice(1);

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    async function loadProducts() {
        try {
            var res = await _supabase.from('PRODUITS').select('*').ilike('categorie', '%' + catFilter + '%').order('id', { ascending: false });
            var data = res.data;
            var error = res.error;
            if (error) throw error;

            document.getElementById('loading').style.display = 'none';

            if (!data || data.length === 0) {
                document.getElementById('no-products').classList.remove('hidden');
                document.getElementById('products-grid').style.display = 'none';
                return;
            }

            document.getElementById('cat-count').textContent = data.length + ' produit' + (data.length > 1 ? 's' : '');
            document.getElementById('products-grid').style.display = 'grid';
            renderProducts(data);
        } catch (e) {
            console.error('[YARID] Erreur:', e);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('no-products').classList.remove('hidden');
        }
    }

    function renderProducts(items) {
        var grid = document.getElementById('products-grid');
        var html = '';
        for (var i = 0; i < items.length; i++) {
            try {
                var p = items[i];
                var pid = p.id || 0;
                var pname = escapeHtml(p.name || 'Produit');
                var pprice = p.price || 0;
                var pimage = escapeHtml(p.image_url) || 'https://via.placeholder.com/400x400?text=YARID';
                var pcat = escapeHtml(p.categorie || '');
                var pold = p.old_price || 0;
                var isStarProd = p.is_star ? 'star-shimmer' : '';
                var discountBadge = '';
                if (pold && pold > pprice) {
                    var pct = Math.round((1 - pprice / pold) * 100);
                    discountBadge = '<span style="position:absolute;top:8px;right:8px;background:#ef4444;color:#fff;font-size:9px;font-weight:800;padding:2px 8px;border-radius:9999px;z-index:10;">-' + pct + '%</span>';
                }
                var starBadge = '';
                if (p.is_star) starBadge = '<span style="position:absolute;top:8px;left:8px;background:#facc15;color:#713f12;font-size:9px;font-weight:800;padding:2px 8px;border-radius:9999px;z-index:10;">STAR</span>';
                var oldPriceHtml = '';
                if (pold && pold > pprice) oldPriceHtml = '<span class="product-old-price">' + pold.toLocaleString() + ' F</span>';
                var priceStr = pprice.toLocaleString() + ' FCFA';

                html += '<div class="product-card-animated ' + isStarProd + '" onclick="window.location.href=\'produit-detail.html?id=' + pid + '\'" style="cursor:pointer;">';
                html += '  <div class="product-image-container">';
                html += '    <img src="' + pimage + '" alt="' + pname + '" loading="lazy" onerror="this.style.display=\'none\';this.parentNode.style.background=\'#f1f5f9\';">';
                html += starBadge;
                html += discountBadge;
                html += '  </div>';
                html += '  <div class="product-info-v2">';
                html += '    <p class="product-cat-v2">' + pcat + '</p>';
                html += '    <h4 class="product-title-v2">' + pname + '</h4>';
                html += '    <div class="product-price-prow-v2">';
                html += '      <span class="product-price-v2">' + priceStr + '</span>';
                html += oldPriceHtml;
                html += '    </div>';
                html += '    <div class="product-arrow-hint">';
                html += '      <span>Voir le produit</span>';
                html += '      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>';
                html += '    </div>';
                html += '  </div>';
                html += '</div>';
            } catch (e) { console.error('Erreur rendu produit', e); }
        }
        grid.innerHTML = html;
    }

    function orderViaWhatsApp() {
    if (typeof window.openCheckout === 'function') {
        window.openCheckout();
    } else {
        alert("Le système de commande n'est pas chargé. Vérifiez que yarid-checkout.js est bien présent.");
    }
}

loadProducts();

    </script>
